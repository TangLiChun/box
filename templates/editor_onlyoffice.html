<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ filename }} - ONLYOFFICE Editor</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #2c3e50;
        }
        #placeholder {
            height: 100%;
            width: 100%;
        }
        .back-btn {
            position: fixed;
            top: 10px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 15px;
            border-radius: 4px;
            text-decoration: none;
            font-family: sans-serif;
            font-size: 14px;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: rgba(0, 0, 0, 0.8);
            border-color: white;
        }
    </style>
</head>
<body>
    <a href="{{ url_for('index') }}" class="back-btn">返回文件列表</a>
    <div id="placeholder">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: white; font-family: sans-serif;">
            <div id="loader" style="margin-bottom: 20px;">
                <div style="width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1); border-top-color: #3498db; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            </div>
            <div id="status-msg">正在加载 ONLYOFFICE 编辑器...</div>
        </div>
    </div>

    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script type="text/javascript" src="{{ onlyoffice_url }}web-apps/apps/api/documents/api.js" onerror="onApiError()"></script>
    <script type="text/javascript">
        function onApiError() {
            const loader = document.getElementById('loader');
            if (loader) loader.style.display = 'none';
            document.getElementById('status-msg').innerHTML = '<span style="color: #e74c3c; padding: 20px; text-align: center;">无法加载 ONLYOFFICE API。<br>请检查设置中的 Document Server 地址是否正确，<br>并确保浏览器可以访问到该地址。</span>';
        }

        try {
            if (typeof DocsAPI !== 'undefined') {
                window.docEditor = new DocsAPI.DocEditor("placeholder", {{ config | tojson }});
            } else {
                // Wait a bit more for slow loads
                setTimeout(() => {
                    if (typeof DocsAPI === 'undefined') onApiError();
                }, 5000);
            }
        } catch (e) {
            console.error(e);
            onApiError();
        }
    </script>
</body>
</html>
