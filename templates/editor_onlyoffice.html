<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ filename }} - ONLYOFFICE Editor</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #2c3e50;
        }
        #placeholder {
            height: 100%;
            width: 100%;
        }
        .back-btn {
            position: fixed;
            top: 10px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 15px;
            border-radius: 4px;
            text-decoration: none;
            font-family: sans-serif;
            font-size: 14px;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: rgba(0, 0, 0, 0.8);
            border-color: white;
        }
    </style>
</head>
<body>
    <a href="{{ url_for('index') }}" class="back-btn">返回文件列表</a>
    <div id="placeholder"></div>

    <script type="text/javascript" src="{{ onlyoffice_url }}web-apps/apps/api/documents/api.js"></script>
    <script type="text/javascript">
        window.docEditor = new DocsAPI.DocEditor("placeholder", {{ config | tojson }});
    </script>
</body>
</html>
