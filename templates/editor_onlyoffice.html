<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ filename }} - ONLYOFFICE Editor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top left, rgba(58, 169, 255, 0.18), transparent 24%),
                linear-gradient(180deg, #07111f 0%, #060c18 100%);
            color: #fff;
        }
        #placeholder {
            height: 100%;
            width: 100%;
        }
        .editor-shell {
            position: fixed;
            top: 1rem;
            left: 1rem;
            right: 1rem;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            pointer-events: none;
        }
        .editor-shell > * {
            pointer-events: auto;
        }
        .editor-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.7rem 0.95rem;
            background: rgba(14, 26, 48, 0.88);
            border: 1px solid rgba(100, 160, 230, 0.12);
            border-radius: 14px;
            backdrop-filter: blur(20px);
            color: #eaf2ff;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
            max-width: min(55vw, 580px);
        }
        .editor-chip strong {
            white-space: nowrap;
        }
        .editor-chip span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #94acc8;
        }
        .back-btn {
            background: rgba(14, 26, 48, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #fff;
            border: 1px solid rgba(100, 160, 230, 0.12);
            padding: 0.6rem 1.25rem;
            border-radius: 14px;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
        }
        .back-btn:hover {
            background: rgba(58, 169, 255, 0.12);
            border-color: rgba(58, 169, 255, 0.35);
            color: #7dd3fc;
            transform: translateY(-2px);
        }
        @media (max-width: 768px) {
            .editor-shell {
                top: 0.8rem;
                left: 0.8rem;
                right: 0.8rem;
                flex-direction: column;
                align-items: stretch;
            }
            .editor-chip {
                max-width: none;
            }
            .back-btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="editor-shell">
        <div class="editor-chip">
            <strong><i class="fa-solid fa-file-lines"></i> 正在编辑</strong>
            <span>{{ filename }}</span>
        </div>
        <a href="{{ url_for('main.index') }}" class="back-btn"><i class="fa-solid fa-arrow-left"></i> 返回文件列表</a>
    </div>
    <div id="placeholder">
        <div class="loader-shell">
            <div id="loader" class="loader-block">
                <div class="loader-ring"></div>
            </div>
            <div id="status-msg">正在加载 ONLYOFFICE 编辑器...</div>
        </div>
    </div>

    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script type="text/javascript" src="{{ onlyoffice_url }}web-apps/apps/api/documents/api.js" onerror="onApiError()"></script>
    <script type="text/javascript">
        function onApiError() {
            const loader = document.getElementById('loader');
            if (loader) loader.style.display = 'none';
            document.getElementById('status-msg').innerHTML = '<span class="status-error">无法加载 ONLYOFFICE API。<br>请检查设置中的 Document Server 地址是否正确，<br>并确保浏览器可以访问到该地址。</span>';
        }

        try {
            if (typeof DocsAPI !== 'undefined') {
                window.docEditor = new DocsAPI.DocEditor("placeholder", {{ config | tojson }});
            } else {
                // Wait a bit more for slow loads
                setTimeout(() => {
                    if (typeof DocsAPI === 'undefined') onApiError();
                }, 5000);
            }
        } catch (e) {
            console.error(e);
            onApiError();
        }
    </script>
</body>
</html>
