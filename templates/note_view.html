{% extends "base.html" %}

{% block title %}{{ title }} - NexFile{% endblock %}

{% block extra_head %}
<!-- Add highlighting for markdown code blocks -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
<style>
    .markdown-body {
        padding: 1rem 0;
        color: var(--text-color);
        line-height: 1.6;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
        margin-top: 1.5rem;
        margin-bottom: 1rem;
        color: var(--accent-1);
    }
    .markdown-body p {
        margin-bottom: 1rem;
    }
    .markdown-body a {
        color: var(--accent-2);
        text-decoration: none;
    }
    .markdown-body a:hover {
        text-decoration: underline;
    }
    .markdown-body ul, .markdown-body ol {
        padding-left: 2rem;
        margin-bottom: 1rem;
    }
    .markdown-body code {
        background: rgba(255, 255, 255, 0.1);
        padding: 0.2rem 0.4rem;
        border-radius: 4px;
        font-family: monospace;
        font-size: 0.9em;
    }
    .markdown-body pre {
        background: #282c34;
        padding: 1rem;
        border-radius: 8px;
        overflow-x: auto;
        margin-bottom: 1rem;
    }
    .markdown-body pre code {
        background: transparent;
        padding: 0;
    }
    .markdown-body table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1rem;
    }
    .markdown-body table th, .markdown-body table td {
        border: 1px solid var(--card-border);
        padding: 0.75rem;
        text-align: left;
    }
    .markdown-body table th {
        background: rgba(255, 255, 255, 0.05);
        font-weight: 600;
    }
    .markdown-body blockquote {
        border-left: 4px solid var(--accent-2);
        padding-left: 1rem;
        margin-left: 0;
        color: #94a3b8;
        background: rgba(129, 140, 248, 0.1);
        padding: 0.5rem 1rem;
        border-radius: 0 4px 4px 0;
    }
</style>
{% endblock %}

{% block content %}
<div class="glass-panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--card-border); padding-bottom: 1rem;">
        <h2 style="margin: 0;"><i class="fa-brands fa-markdown" style="color: var(--accent-1);"></i> {{ title }}</h2>
        <div>
            <a href="{{ url_for('notes') }}" class="btn btn-sm btn-outline" style="margin-right: 0.5rem;"><i class="fa-solid fa-arrow-left"></i> 返回</a>
            <a href="{{ url_for('edit_note', filename=filename) }}" class="btn btn-sm btn-primary"><i class="fa-solid fa-pen"></i> 编辑</a>
        </div>
    </div>
    
    <div class="markdown-body">
        {{ content | safe }}
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
<script>hljs.highlightAll();</script>
{% endblock %}
