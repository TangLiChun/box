<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ '编辑笔记' if is_edit else '新建笔记' }} - NexFile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Highlight.js for code blocks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>

    <style>
        .editor-container {
            display: flex;
            gap: 2rem;
            min-height: 60vh;
        }
        .editor-textarea {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-color);
            padding: 1.5rem;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 1rem;
            resize: none;
            outline: none;
            line-height: 1.6;
            transition: border-color 0.3s ease;
        }
        .editor-textarea:focus {
            border-color: var(--accent-1);
        }
        
        /* New split-pane styling */
        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            border: 1px solid var(--card-border);
            padding: 1rem;
        }

        .preview-pane {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            border: 1px solid var(--card-border);
            padding: 1rem;
            overflow-y: auto;
            color: var(--text-color);
        }

        .preview-pane h1, .preview-pane h2, .preview-pane h3 {
            color: var(--accent-1);
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 0.5rem;
        }

        .preview-pane p {
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .preview-pane code {
            background: rgba(0,0,0,0.5);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: monospace;
            color: #fca5a5;
        }

        .preview-pane pre code {
            display: block;
            padding: 1rem;
            color: #e2e8f0;
            background: #1e293b;
        }

        .preview-pane blockquote {
            border-left: 4px solid var(--accent-1);
            padding-left: 1rem;
            margin-left: 0;
            color: #94a3b8;
            font-style: italic;
        }
        
        @media (max-width: 900px) {
            .editor-container {
                flex-direction: column;
            }
        }

        /* Existing editor-textarea styles, adjusted for new structure */
        .content-textarea {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-color);
            padding: 1.5rem;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 1rem;
            resize: none;
            outline: none;
            line-height: 1.6;
            transition: border-color 0.3s ease;
        }
        .content-textarea:focus {
            border-color: var(--accent-1);
        }
        .title-input {
            width: 100%;
            border: 1px solid var(--accent-1);
            background: rgba(0,0,0,0.2);
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .title-input:focus {
            border-color: var(--accent-2);
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 1400px;">
        <header class="glass-panel" style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 2rem;">
                <h1 class="gradient-text" style="margin: 0;"><i class="fa-solid fa-layer-group"></i> NexFile</h1>
                <nav class="top-nav">
                    <a href="{{ url_for('index') }}" class="nav-link"><i class="fa-solid fa-folder-open"></i> 文件管理</a>
                    <a href="{{ url_for('notes') }}" class="nav-link active"><i class="fa-solid fa-book"></i> 笔记管理</a>
                    <a href="{{ url_for('game') }}" class="nav-link"><i class="fa-solid fa-dharmachakra"></i> 幸运转盘</a>
                    <a href="{{ url_for('admin') }}" class="nav-link"><i class="fa-solid fa-users-gear"></i> 后台管理</a>
                </nav>
            </div>
        </header>

        <!-- Page Actions & Title -->
        <div class="glass-panel" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding: 1.25rem 2rem;">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <h2 style="margin: 0;"><i class="fa-solid fa-{{ 'pen' if is_edit else 'plus' }}"></i> {{ '编辑笔记' if is_edit else '新建 Markdown 笔记' }}</h2>
                <div id="save-status" title="状态" style="width: 10px; height: 10px; border-radius: 50%; background: var(--success); transition: var(--transition-fast);"></div>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span id="dirty-msg" style="color: var(--warning); font-size: 0.85rem; opacity: 0; transition: var(--transition-fast);"><i class="fa-solid fa-circle-exclamation"></i> 未保存的更改</span>
                <span class="text-sm" style="color: #94a3b8; font-size: 0.85rem;">(快捷键: Ctrl+S 保存)</span>
                <button type="submit" form="noteForm" class="btn btn-primary" id="saveBtn"><i class="fa-solid fa-floppy-disk"></i> 保存笔记</button>
                <a href="{{ url_for('notes') }}" class="btn btn-secondary" style="margin-left: 0;"><i class="fa-solid fa-arrow-left-long"></i> 返回</a>
            </div>
        </div>

        <form action="{{ url_for('edit_note', filename=original_filename) if is_edit else url_for('create_note') }}" method="post" id="noteForm" style="display: flex; flex-direction: column; gap: 1.5rem; height: calc(100vh - 280px);">
            <div class="glass-panel" style="padding: 1.5rem;">
                <label for="title" style="display: block; margin-bottom: 0.75rem; font-weight: 500; color: #cbd5e1;">笔记标题</label>
                <input type="text" id="title" name="title" class="title-input" required 
                       value="{{ title if is_edit else '' }}"
                       placeholder="输入笔记标题...">
            </div>
            
            <div class="editor-container" style="flex: 1; display: flex; gap: 1.5rem; min-height: 0;">
                <div class="editor-pane">
                    <label for="noteContent" style="display: flex; justify-content: space-between; margin-bottom: 0.75rem; font-weight: 500; color: #94a3b8;">
                        <span><i class="fa-brands fa-markdown" style="color: var(--accent-1);"></i> Markdown 编辑区</span>
                    </label>
                    <div class="editor-toolbar">
                        <button type="button" class="toolbar-btn" onclick="insertTag('**', '**')" title="粗体"><i class="fa-solid fa-bold"></i></button>
                        <button type="button" class="toolbar-btn" onclick="insertTag('*', '*')" title="斜体"><i class="fa-solid fa-italic"></i></button>
                        <button type="button" class="toolbar-btn" onclick="insertTag('# ', '')" title="标题"><i class="fa-solid fa-heading"></i></button>
                        <button type="button" class="toolbar-btn" onclick="insertTag('[', '](url)')" title="链接"><i class="fa-solid fa-link"></i></button>
                        <button type="button" class="toolbar-btn" onclick="insertTag('```\n', '\n```')" title="代码块"><i class="fa-solid fa-code"></i></button>
                    </div>
                    <textarea id="noteContent" name="content" class="content-textarea" required 
                              placeholder="支持 Markdown 语法..." oninput="updatePreview(); setDirty(true)">{{ content if is_edit else '' }}</textarea>
                </div>
                
                <div class="preview-pane">
                    <label style="display: block; margin-bottom: 0.75rem; font-weight: 500; color: #94a3b8;">
                        <i class="fa-solid fa-eye" style="color: var(--accent-2);"></i> 实时预览
                    </label>
                    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin-bottom: 1rem;">
                    <div id="preview-content" class="markdown-body">
                        <!-- Preview will render here -->
                    </div>
                </div>
            </div>
        </form>
    </div>
    
    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        // Setup marked with highlight.js
        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            },
            breaks: true,
            gfm: true
        });

        const noteContentTextarea = document.getElementById('noteContent');
        const titleInput = document.getElementById('title');
        const preview = document.getElementById('preview-content');
        const form = document.getElementById('noteForm');
        const saveButton = document.getElementById('saveBtn');
        const saveStatus = document.getElementById('save-status');
        const dirtyMsg = document.getElementById('dirty-msg');
        
        let isDirty = false;

        function setDirty(dirty) {
            isDirty = dirty;
            saveStatus.style.background = dirty ? 'var(--warning)' : 'var(--success)';
            dirtyMsg.style.opacity = dirty ? '1' : '0';
        }

        // Live Preview rendering
        function updatePreview() {
            preview.innerHTML = marked.parse(noteContentTextarea.value);
            setDirty(true);
        }
        
        noteContentTextarea.addEventListener('input', updatePreview);
        titleInput.addEventListener('input', () => setDirty(true));
        
        // Initial render
        preview.innerHTML = marked.parse(noteContentTextarea.value);
        setDirty(false); // Reset on load
        
        // Handle tab in textarea
        noteContentTextarea.addEventListener('keydown', function(e) {
          if (e.key == 'Tab') {
            e.preventDefault();
            var start = this.selectionStart;
            var end = this.selectionEnd;
            this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
            this.selectionStart = this.selectionEnd = start + 4;
          }
        });

        // Auto-save via Ctrl+S
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveNoteAjax();
            }
        });
        
        // Function to show toast messages
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            const icon = type === 'success' ? '<i class="fa-solid fa-circle-check"></i>' : '<i class="fa-solid fa-circle-exclamation"></i>';
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function insertTag(startTag, endTag) {
            const textarea = document.getElementById('noteContent');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            const before = text.substring(0, start);
            const after = text.substring(end);
            const selected = text.substring(start, end);
            
            textarea.value = before + startTag + selected + endTag + after;
            textarea.focus();
            
            // Set cursor position
            let newPos;
            if (selected.length === 0) { // If no text was selected, place cursor between tags
                newPos = start + startTag.length;
            } else { // If text was selected, place cursor after the closing tag
                newPos = start + startTag.length + selected.length + endTag.length;
            }
            textarea.setSelectionRange(newPos, newPos);
            
            updatePreview();
            setDirty(true);
        }

        // AJAX save function
        async function saveNoteAjax() {
            const titleInput = document.getElementById('title');
            const title = titleInput.value.trim();
            const content = noteContentTextarea.value;

            if (!title) {
                showToast("标题不能为空", "error");
                titleInput.focus();
                return;
            }

            saveButton.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> 保存中...';
            saveButton.disabled = true;

            const formData = new FormData(form);
            const url = form.getAttribute('action');
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest' // Identifying as AJAX
                    }
                });

                if (response.ok) {
                    const result = await response.json(); 
                    if (result.success) {
                        showToast('笔记已保存', 'success');
                        setDirty(false);
                        // If it's a new note, redirect to its edit page
                        if (result.redirect) {
                            setTimeout(() => {
                                window.location.href = result.redirect;
                            }, 500);
                        }
                    } else {
                        showToast(result.message || '保存失败', 'error');
                    }
                } else {
                    showToast('保存失败，服务器响应错误', 'error');
                }
            } catch (error) {
                showToast('保存时发生网络错误', 'error');
            } finally {
                saveButton.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> 保存笔记';
                saveButton.disabled = false;
            }
        }

        // Attach saveNoteAjax to the form's submit button
        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent default form submission
            saveNoteAjax();
        });
    </script>
</body>
</html>
