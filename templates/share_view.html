<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - NexFile 共享笔记</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script>hljs.highlightAll();</script>

</head>
<body>
    <div class="container page-wrap">
        <div class="page-shell page-shell-narrow">
            <section class="glass-panel page-hero">
                <div class="page-hero-top">
                    <div>
                        <div class="page-eyebrow"><i class="fa-solid fa-share-nodes"></i> Shared Reading</div>
                        <h1 class="page-title gradient-text">NexFile 共享阅览</h1>
                        <p class="page-subtitle">这是一条公开分享的笔记链接。阅读视图保留了标题层次、代码高亮和引用样式，尽量让外部访问者也能获得清爽的阅读体验。</p>
                    </div>
                    <div class="hero-actions">
                        <span class="public-badge">公开分享</span>
                    </div>
                </div>
            </section>

            <section class="glass-panel surface-card">
                <div class="section-head">
                    <div class="section-title">
                        <i class="fa-brands fa-markdown public-markdown-icon"></i>
                        <div>
                            <h2>{{ title }}</h2>
                            <div class="section-kicker">公开笔记内容</div>
                        </div>
                    </div>
                </div>
                <div class="markdown-body">
                    {{ content | safe }}
                </div>
            </section>
        </div>
    </div>
</body>
</html>
