<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - NexFile 共享笔记</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script>hljs.highlightAll();</script>

    <style>
        .markdown-body {
            padding: 1rem 0;
            color: var(--text-primary);
            line-height: 1.6;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }
        .markdown-body p {
            margin-bottom: 1rem;
        }
        .markdown-body a {
            color: var(--accent-light);
            text-decoration: none;
        }
        .markdown-body a:hover {
            text-decoration: underline;
        }
        .markdown-body ul, .markdown-body ol {
            padding-left: 2rem;
            margin-bottom: 1rem;
        }
        .markdown-body code {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
        }
        .markdown-body pre {
            background: #282c34;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 1rem;
        }
        .markdown-body pre code {
            background: transparent;
            padding: 0;
        }
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }
        .markdown-body table th, .markdown-body table td {
            border: 1px solid var(--border-default);
            padding: 0.75rem;
            text-align: left;
        }
        .markdown-body table th {
            background: rgba(255, 255, 255, 0.05);
            font-weight: 600;
        }
        .markdown-body blockquote {
            border-left: 4px solid var(--accent-light);
            padding-left: 1rem;
            margin-left: 0;
            color: #94a3b8;
            background: rgba(129, 140, 248, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 0 4px 4px 0;
        }
        .public-badge {
            background: var(--accent-light);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            vertical-align: middle;
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container" style="padding: 2rem 1.25rem 3rem;">
        <div class="page-shell" style="max-width: 960px; margin: 0 auto;">
            <section class="glass-panel page-hero">
                <div class="page-hero-top">
                    <div>
                        <div class="page-eyebrow"><i class="fa-solid fa-share-nodes"></i> Shared Reading</div>
                        <h1 class="page-title gradient-text">NexFile 共享阅览</h1>
                        <p class="page-subtitle">这是一条公开分享的笔记链接。阅读视图保留了标题层次、代码高亮和引用样式，尽量让外部访问者也能获得清爽的阅读体验。</p>
                    </div>
                    <div class="hero-actions">
                        <span class="public-badge">公开分享</span>
                    </div>
                </div>
            </section>

            <section class="glass-panel surface-card">
                <div class="section-head">
                    <div class="section-title">
                        <i class="fa-brands fa-markdown" style="color: var(--accent-light);"></i>
                        <div>
                            <h2>{{ title }}</h2>
                            <div class="section-kicker">公开笔记内容</div>
                        </div>
                    </div>
                </div>
                <div class="markdown-body">
                    {{ content | safe }}
                </div>
            </section>
        </div>
    </div>
</body>
</html>
