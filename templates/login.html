<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - NexFile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        const savedTheme = localStorage.getItem('nexfile-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <style>
        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #2a8ce2, #4db8ff);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            margin-bottom: 1rem;
            box-shadow: 0 8px 24px rgba(42, 140, 226, 0.3);
        }
        .login-logo h1 {
            font-size: 1.75rem;
            margin-bottom: 0.25rem;
        }
        .login-logo p {
            color: var(--text-muted);
            font-size: 0.88rem;
        }
        .login-card .form-group label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .login-card .form-group label i {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .login-card .btn-primary {
            margin-top: 0.5rem;
            padding: 0.8rem;
            font-size: 0.95rem;
        }
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card glass-panel">
            <div class="login-logo">
                <div class="logo-icon"><i class="fa-solid fa-layer-group"></i></div>
                <h1 class="gradient-text">NexFile</h1>
                <p>安全文件管理系统</p>
            </div>

            {% if error %}
            <div class="alert"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="form-group">
                    <label for="username"><i class="fa-solid fa-user"></i> 用户名</label>
                    <input type="text" id="username" name="username" required autocomplete="off" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> 密码</label>
                    <input type="password" id="password" name="password" required placeholder="请输入密码">
                </div>
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-arrow-right-to-bracket"></i> 登录</button>
            </form>
            <div class="login-footer">
                <i class="fa-solid fa-shield-halved"></i> 加密传输保障数据安全
            </div>
        </div>
    </div>
</body>
</html>
