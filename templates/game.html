{% extends "base.html" %}

{% block title %}幸运转盘 - NexFile{% endblock %}

{% block extra_head %}
<style>
    .wheel-container {
        position: relative;
        width: 400px;
        height: 400px;
        margin: 2rem auto;
    }
    #wheel {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 8px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 50px rgba(58, 169, 255, 0.3);
        transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
        background: conic-gradient(
            #3aa9ff 0deg 45deg,
            #1e293b 45deg 90deg,
            #3aa9ff 90deg 135deg,
            #0f172a 135deg 180deg,
            #7dd3fc 180deg 225deg,
            #1e293b 225deg 270deg,
            #3aa9ff 270deg 315deg,
            #0f172a 315deg 360deg
        );
        position: relative;
        overflow: hidden;
    }
    .wheel-label {
        position: absolute;
        width: 50%;
        height: 40px;
        top: 50%;
        left: 50%;
        transform-origin: left center;
        padding-left: 80px;
        color: white;
        font-weight: bold;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        pointer-events: none;
        text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }
    .pointer {
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 20px solid transparent;
        border-right: 20px solid transparent;
        border-top: 40px solid #ff4757;
        z-index: 10;
        filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }
    .spin-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 80px;
        height: 80px;
        background: #ff4757;
        border: 4px solid white;
        border-radius: 50%;
        color: white;
        font-weight: bold;
        cursor: pointer;
        z-index: 11;
        box-shadow: 0 0 20px rgba(255,255,255,0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s;
    }
    .spin-btn:hover {
        transform: translate(-50%, -50%) scale(1.1);
    }
    .spin-btn:active {
        transform: translate(-50%, -50%) scale(0.95);
    }
    #resultMessage {
        text-align: center;
        margin-top: 2rem;
        font-size: 1.5rem;
        font-weight: 600;
        color: #3aa9ff;
        min-height: 2.2rem;
        text-shadow: 0 2px 10px rgba(58, 169, 255, 0.3);
    }
</style>
{% endblock %}

{% block content %}
<div class="glass-panel" style="max-width: 800px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h2 style="margin: 0;"><i class="fa-solid fa-dharmachakra"></i> 幸运转盘</h2>
        {% if not is_public %}
        <button id="shareGameBtn" class="btn btn-primary" style="width: auto;"><i class="fa-solid fa-share-nodes"></i> 分享转盘</button>
        {% endif %}
    </div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <div id="wheel">
            <!-- Labels will be injected here -->
        </div>
        <button id="spinBtn" class="spin-btn">SPIN</button>
    </div>

    <div id="resultMessage"></div>
    
    {% if shared_data %}
    <div style="text-align: center; color: var(--text-muted); margin-top: 1rem;">
        <i class="fa-solid fa-info-circle"></i> 正在访问共享的转盘
    </div>
    {% endif %}
</div>
{% endblock %}

{% block scripts %}
<script>
    const wheel = document.getElementById('wheel');
    const spinBtn = document.getElementById('spinBtn');
    const resultMsg = document.getElementById('resultMessage');
    const shareBtn = document.getElementById('shareGameBtn');
    
    let isSpinning = false;
    let rotation = 0;

    const prizes = ["大奖", "谢谢参与", "积分 +10", "谢谢参与", "优惠券", "谢谢参与", "再来一次", "谢谢参与"];
    
    // Create labels
    prizes.forEach((prize, i) => {
        const label = document.createElement('div');
        label.className = 'wheel-label';
        // Pointer is at -90deg? 
        // No, pointer is at top (0deg). 
        // Gradient starts at top. Slice 0 is 0-45.
        // Label should be in middle of slice (22.5 deg).
        label.style.transform = `rotate(${i * 45 + 22.5}deg)`;
        label.innerText = prize;
        wheel.appendChild(label);
    });

    spinBtn.addEventListener('click', () => {
        if (isSpinning) return;
        
        isSpinning = true;
        resultMsg.innerText = '旋转中...';
        
        // Random spin between 5 and 10 full rotations plus a random prize slice
        const randomRotate = Math.floor(Math.random() * 360) + 1800;
        rotation += randomRotate;
        
        wheel.style.transform = `rotate(${rotation}deg)`;
        
        // Calculate prize after animation (4s)
        setTimeout(() => {
            isSpinning = false;
            const actualRotation = rotation % 360;
            // The slice at top (0 deg) is (360 - rotation%360)
            const prizeIndex = Math.floor(((360 - (actualRotation % 360)) % 360) / 45);
            resultMsg.innerText = `🎁 恭喜获得: ${prizes[prizeIndex]}`;
            showToast(`获得奖品: ${prizes[prizeIndex]}`, 'success');
        }, 4000);
    });

    if (shareBtn) {
        shareBtn.addEventListener('click', async () => {
            try {
                const response = await fetch('/game/share', { method: 'POST' });
                const result = await response.json();
                if(result.success) {
                    const url = window.location.origin + '/s/g/' + result.share_id;
                    navigator.clipboard.writeText(url).then(() => {
                        showToast("转盘分享链接已复制", 'success');
                    });
                } else {
                    showToast(result.message, 'error');
                }
            } catch (err) {
                showToast("分享失败", 'error');
            }
        });
    }
</script>
{% endblock %}
